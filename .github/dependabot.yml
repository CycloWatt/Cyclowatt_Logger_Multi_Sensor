# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

    # The @radix-ui packages share internal helpers (primitive, react-slot,
    # react-presence, ...). Bumped one at a time, every bump nests its own newer
    # copy of those helpers next to the old ones the other packages still use.
    # One PR for the whole family keeps them in step and the lockfile deduped.
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"

    ignore:
      # @types/node must describe the Node major that CI and the Pages deploy
      # actually run (node-version in ci.yml / pages.yml). A newer major would
      # type-check APIs the runtime does not have. Bump both together, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
