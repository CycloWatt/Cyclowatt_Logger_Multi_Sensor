# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

    # The @radix-ui packages share internal helpers (primitive, react-slot,
    # react-presence, ...). Bumped one at a time, every bump nests its own newer
    # copy of those helpers next to the old ones the other packages still use.
    # One PR for the whole family keeps them in step and the lockfile deduped.
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"

    # @types/node majors are deliberately NOT ignored: that PR is the only
    # notice of a new Node line. ci.yml fails it until node-version in the
    # workflows is bumped along with it.

  # Workflow actions were not covered, so ci.yml and pages.yml fell several
  # majors behind (checkout, setup-node, the three Pages actions). Same shape
  # as logger-fw and power-analysis-suite: one grouped weekly PR for all actions.
  - package-ecosystem: "github-actions"
    # "/" makes Dependabot scan all workflows under .github/workflows.
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
